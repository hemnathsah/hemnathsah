name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install small runtime dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Render contribution SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed data and SVG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo "Contribution art has no changes."
          else
            git commit -m "chore: refresh contribution heatmap [skip ci]"
            git push
          fi
